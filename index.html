<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salvia - Coming Soon</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #fbf8f3; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            transform: scale(1.2); /* Medium zoom for desktops */
            transform-origin: center center;
        }
        @media (max-width: 480px) {
            iframe {
                transform: scale(1.5); /* Perfect zoom factor for mobile phones */
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe src="Untitled design (1).png"></iframe>
    </div>
</body>
</html>
