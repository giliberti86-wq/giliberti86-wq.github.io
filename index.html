<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salvia - Coming Soon</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #fbf8f3; 
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        .coming-soon-img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 450px; /* Limits size so it never looks too big on desktop */
            max-height: 85vh;
            object-fit: contain;
        }
        /* Mobile adjustment to ensure perfect scaling on phone screens */
        @media (max-width: 768px) {
            .coming-soon-img {
                max-width: 85%;
                max-height: 75vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="coming-soon-img" src="Untitled design (1).png" alt="Salvia Coming Soon">
    </div>
</body>
</html>
